name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nuxt-app/package-lock.json

      - name: Install dependencies
        working-directory: nuxt-app
        run: npm ci

      - name: Generate static site
        working-directory: nuxt-app
        run: npm run generate

      - name: Add CNAME and .nojekyll
        run: |
          cp CNAME nuxt-app/.output/public/CNAME
          touch nuxt-app/.output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nuxt-app/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
