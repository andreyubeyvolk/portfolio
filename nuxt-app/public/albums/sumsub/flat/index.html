<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo album</title>
<style>
  /* The flat version of the album: no 3D, no filters, no WebGL, just pre-rendered pictures of the cover and of every spread.
     Made for phones and for anything that struggles with the real 3D book (see bake_flat.py). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ba8d0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; cursor: pointer; }
  .s { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none;
       opacity: 0; transform: translate3d(0, 0, 0); transition: opacity .34s ease, transform .34s cubic-bezier(.3, .7, .2, 1); }
  .s.on { opacity: 1; }
  .s.from-r { transform: translate3d(5%, 0, 0); } .s.from-l { transform: translate3d(-5%, 0, 0); }
  .s.to-r { transform: translate3d(5%, 0, 0); } .s.to-l { transform: translate3d(-5%, 0, 0); }
  @media (prefers-reduced-motion: reduce) { .s { transition: opacity .2s linear; } .s.from-r, .s.from-l, .s.to-r, .s.to-l { transform: none; } }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Photo album: tap the right half for the next spread, the left half for the previous"></div>
<script>
'use strict';
const FLAT = {"files":["s00.webp","s01.webp","s02.webp","s03.webp","s04.webp","s05.webp","s06.webp","s07.webp","s08.webp","s09.webp","s10.webp","s11.webp","s12.webp","s13.webp","s14.webp","s15.webp","s16.webp","s17.webp","s18.webp"]};                      // { files: ['s00.webp', 's01.webp', ...] }  0 = the closed album, 1..n = the spreads
const N = FLAT.files.length - 1, stage = document.getElementById('stage');
const post = m => { try { parent.postMessage(Object.assign({ source: 'moleskine-album' }, m), '*'); } catch (e) {} };
const loaded = new Map();                   // index -> Promise<HTMLImageElement>
const load = k => { k = Math.max(0, Math.min(N, k)); if (!loaded.has(k)) loaded.set(k, new Promise(res => { const im = new Image(); im.onload = im.onerror = () => res(im); im.decoding = 'async'; im.src = FLAT.files[k]; })); return loaded.get(k); };
let cur = -1, busy = false, queued = 0;
const mk = () => { const im = document.createElement('img'); im.className = 's'; im.alt = ''; im.draggable = false; stage.appendChild(im); return im; };
const els = [mk(), mk()]; let front = 0;
async function go(k, dir) {
  k = Math.max(0, Math.min(N, k)); if (k === cur) return;
  if (busy) { queued = k; return; }
  busy = true; const old = cur >= 0 ? els[front] : null, im = els[1 - front], d = dir || (k > cur ? 1 : -1);
  const src = await load(k); im.src = src.src; im.alt = k === 0 ? 'Album cover' : 'Spread ' + k + ' of ' + N;
  im.className = 's ' + (d > 0 ? 'from-r' : 'from-l'); void im.offsetWidth;                // start from the side, then ease in
  im.className = 's on';
  if (old) old.className = 's ' + (d > 0 ? 'to-l' : 'to-r');
  cur = k; front = 1 - front;
  setTimeout(() => { busy = false; if (old) old.className = 's'; if (queued !== 0 && queued !== cur) { const q = queued; queued = 0; go(q); } else queued = 0; }, 360);
  warm(k + 1); warm(k - 1);
}
// everything else is fetched in the background, nearest first, two at a time
const order = []; for (let d = 1; d <= N; d++) { order.push(d); }
let qi = 0; const pump = () => { if (qi >= order.length) return; load(order[qi++]).then(pump); };
const warm = k => { if (k >= 0 && k <= N) load(k); };
// input: one tap handler for mouse, touch and pen (left half back, right half forward), swipes, arrow keys
let sx = 0, sy = 0, st = 0, sid = null;
const step = d => { if (cur === 0 && d < 0) return; if (cur === N && d > 0) go(0, 1); else go(cur + d, d); };
addEventListener('pointerdown', e => { if (e.button > 0) return; sid = e.pointerId; sx = e.clientX; sy = e.clientY; st = performance.now(); }, true);
addEventListener('pointerup', e => {
  if (e.pointerId !== sid) return; sid = null; const dx = e.clientX - sx, dy = e.clientY - sy, dt = performance.now() - st;
  if (Math.hypot(dx, dy) < 10 && dt < 800) step(e.clientX < innerWidth / 2 ? -1 : 1);
  else if (e.pointerType !== 'mouse' && dt < 700 && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
}, true);
addEventListener('click', e => e.stopImmediatePropagation(), true);
addEventListener('keydown', e => { if (e.code === 'ArrowRight' || e.code === 'PageDown' || e.code === 'Space') { e.preventDefault(); step(1); } else if (e.code === 'ArrowLeft' || e.code === 'PageUp') { e.preventDefault(); step(-1); } });
// the page that embeds us scrolls smoothly: hand the wheel over
if (parent !== window) addEventListener('wheel', e => { e.preventDefault(); post({ type: 'wheel', dx: e.deltaX, dy: e.deltaY, mode: e.deltaMode }); }, { passive: false });
// start: the closed album, which opens by itself a moment after it is on screen
let opened = false, t = 0;
go(0, 1);
load(0).then(() => { post({ type: 'ready' }); setTimeout(() => { pump(); pump(); }, 300); });
const open = () => { if (!opened && cur === 0 && !busy) { opened = true; go(1, 1); } };
if ('IntersectionObserver' in window) new IntersectionObserver(es => { for (const e of es) { if (e.isIntersecting && e.intersectionRatio >= .55) { clearTimeout(t); t = setTimeout(open, 900); } else clearTimeout(t); } }, { threshold: [0, .55, 1] }).observe(document.documentElement);
else setTimeout(open, 1200);
if (/[?&]at=\d+/.test(location.search)) { opened = true; go(+location.search.match(/[?&]at=(\d+)/)[1], 1); }
</script>
</body>
</html>
