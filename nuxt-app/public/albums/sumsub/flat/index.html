<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Photo album</title>
<style>
  /* The flat version of the album: no 3D, no filters, no WebGL, just pre-rendered pictures of the cover, of every spread and of the back cover.
     Made for phones and for anything that struggles with the real 3D book (see bake_flat.js). */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a3adc2; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; cursor: pointer; }
  .s { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none;
       opacity: 0; transform: translate3d(0, 0, 0); transition: opacity .34s ease, transform .34s cubic-bezier(.3, .7, .2, 1); }
  .s.on { opacity: 1; }
  .s.from-r { transform: translate3d(5%, 0, 0); } .s.from-l { transform: translate3d(-5%, 0, 0); }
  .s.to-r { transform: translate3d(5%, 0, 0); } .s.to-l { transform: translate3d(-5%, 0, 0); }
  /* shown only when a picture takes more than a moment to arrive (slow network) */
  #wait { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, .16); border-top-color: rgba(0, 0, 0, .55);
          opacity: 0; transition: opacity .25s; pointer-events: none; animation: spin .8s linear infinite; }
  #wait.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .s { transition: opacity .2s linear; } .s.from-r, .s.from-l, .s.to-r, .s.to-l { transform: none; } #wait { animation-duration: 2.4s; } }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Photo album: tap the right half for the next page, the left half for the previous"><div id="wait"></div></div>
<script>
'use strict';
const FLAT = {"files":["s00.webp","s01.webp","s02.webp","s03.webp","s04.webp","s05.webp","s06.webp","s07.webp","s08.webp","s09.webp","s10.webp","s11.webp","s12.webp","s13.webp","s14.webp","s15.webp","s16.webp","s17.webp","s18.webp","s19.webp"]};                      // { files: ['s00.webp', ...] }  0 = the closed album, 1..n = the spreads, last = the back cover
const LAST = FLAT.files.length - 1, stage = document.getElementById('stage'), spin = document.getElementById('wait');
const V = new URLSearchParams(location.search).get('v');          // the page's version tag, so a new export is never mixed with cached old pictures
const urlOf = (k, retry) => FLAT.files[k] + (V ? '?v=' + encodeURIComponent(V) : '') + (retry ? (V ? '&' : '?') + '_r=' + retry : '');
const post = m => { try { parent.postMessage(Object.assign({ source: 'moleskine-album' }, m), '*'); } catch (e) {} };
const wait = ms => new Promise(r => setTimeout(r, ms));
const conn = navigator.connection || {};
const SLOW = !!(conn.saveData || /(^|-)2g$/.test(conn.effectiveType || ''));       // data saver / 2G: no background download of the whole album

// ---- pictures: loaded with retries and a timeout; only the current one and its neighbours are kept decoded (phones have little memory)
const KEEP = 2, loaded = new Map();         // index -> Promise<HTMLImageElement | null>
function fetchImage(k, retry) {
  return new Promise(res => {
    const im = new Image(); let done = false, timer = 0;
    const end = ok => { if (done) return; done = true; clearTimeout(timer); im.onload = im.onerror = null; res(ok ? im : null); };
    timer = setTimeout(() => { im.src = ''; end(false); }, 20000);
    im.onload = () => end(true); im.onerror = () => end(false);
    im.decoding = 'async'; im.src = urlOf(k, retry);
  });
}
function load(k) {
  if (k < 0 || k > LAST) return Promise.resolve(null);
  if (!loaded.has(k)) loaded.set(k, (async () => {
    for (let a = 0; a < 3; a++) {
      const im = await fetchImage(k, a);
      if (im) { try { await im.decode(); } catch (e) {} return im; }
      await wait(500 + a * 1500);
    }
    loaded.delete(k); return null;           // gave up: the next tap tries again
  })());
  return loaded.get(k);
}
const trim = () => { for (const k of [...loaded.keys()]) if (Math.abs(k - cur) > KEEP) loaded.delete(k); };
// everything else is only downloaded into the browser cache (nothing is decoded), nearest to the current picture first, two at a time
const warmed = new Set();
const nextCold = () => { let best = -1, bd = 1e9; for (let k = 0; k <= LAST; k++) if (!warmed.has(k)) { const d = k >= cur ? k - cur : (cur - k) * 1.5; if (d < bd) { bd = d; best = k; } } return best; };
const pump = () => { const k = nextCold(); if (k < 0) return; warmed.add(k); fetch(urlOf(k)).then(r => r.blob()).catch(() => {}).then(pump); };

// ---- showing
let cur = -1, busy = false, queued = -1, front = 0, spinTimer = 0;
const mk = () => { const im = document.createElement('img'); im.className = 's'; im.alt = ''; im.draggable = false; stage.appendChild(im); return im; };
const els = [mk(), mk()];
const showWait = on => { clearTimeout(spinTimer); if (on) spinTimer = setTimeout(() => spin.classList.add('on'), 450); else spin.classList.remove('on'); };
const label = k => k === 0 ? 'Album cover' : k === LAST ? 'Album back cover' : 'Spread ' + k + ' of ' + (LAST - 1);
function settle() { busy = false; const q = queued; queued = -1; if (q >= 0 && q !== cur) go(q); }
async function go(k, dir) {
  k = Math.max(0, Math.min(LAST, k)); if (k === cur) return;
  if (busy) { queued = k; return; }
  busy = true; showWait(true); let ok = false;
  try {
    const pic = await load(k);
    if (pic) {
      const old = cur >= 0 ? els[front] : null, im = els[1 - front], d = dir || (k > cur ? 1 : -1);
      im.src = pic.src; im.alt = label(k); try { await im.decode(); } catch (e) {}
      im.className = 's ' + (d > 0 ? 'from-r' : 'from-l'); void im.offsetWidth;                // start from the side, then ease in
      im.className = 's on';
      if (old) old.className = 's ' + (d > 0 ? 'to-l' : 'to-r');
      cur = k; front = 1 - front; ok = true;
      setTimeout(() => { if (old) old.className = 's'; settle(); }, 360);
      trim(); load(k + 1); load(k - 1);
    }
  } catch (e) {}
  showWait(false);
  if (!ok) settle();                         // the picture did not arrive: stay where we are
}

// ---- input: one tap handler for mouse, touch and pen (left half back, right half forward), swipes, arrow keys
let sx = 0, sy = 0, st = 0, sid = null;
const step = d => { if (cur < 0 || (cur === 0 && d < 0)) return; if (cur === LAST && d > 0) go(0, 1); else go(cur + d, d); };     // after the back cover: the cover again
addEventListener('pointerdown', e => { if (e.button > 0) return; sid = e.pointerId; sx = e.clientX; sy = e.clientY; st = performance.now(); }, true);
addEventListener('pointerup', e => {
  if (e.pointerId !== sid) return; sid = null; const dx = e.clientX - sx, dy = e.clientY - sy, dt = performance.now() - st;
  if (Math.hypot(dx, dy) < 10 && dt < 800) step(e.clientX < innerWidth / 2 ? -1 : 1);
  else if (e.pointerType !== 'mouse' && dt < 700 && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
}, true);
addEventListener('click', e => e.stopImmediatePropagation(), true);
addEventListener('keydown', e => { if (e.code === 'ArrowRight' || e.code === 'PageDown' || e.code === 'Space') { e.preventDefault(); step(1); } else if (e.code === 'ArrowLeft' || e.code === 'PageUp') { e.preventDefault(); step(-1); } });
// the page that embeds us scrolls smoothly: hand the wheel over
if (parent !== window) addEventListener('wheel', e => { e.preventDefault(); post({ type: 'wheel', dx: e.deltaX, dy: e.deltaY, mode: e.deltaMode }); }, { passive: false });

// ---- start: the closed album, which opens by itself a moment after it is on screen
const HOLD = 1800;                         // ms the closed album is on screen (cover shown AND frame in view) before it opens by itself: time to look at the cover
let opened = false, t = 0, visibleAt = 0, coverAt = 0;
(async () => {
  await go(0, 1);
  if (cur !== 0) { post({ type: 'error', reason: 'cover' }); return; }       // the page keeps its poster
  coverAt = performance.now();
  post({ type: 'ready' });
  if (!SLOW) setTimeout(() => { pump(); pump(); }, 300);
})();
const open = () => {
  if (opened) return;
  const left = HOLD - (performance.now() - Math.max(visibleAt, coverAt));
  if (!visibleAt || !coverAt || cur !== 0 || busy || left > 0) { t = setTimeout(open, left > 0 ? Math.max(left, 150) : 400); return; }
  opened = true; go(1, 1);
};
if ('IntersectionObserver' in window) new IntersectionObserver(es => { for (const e of es) { if (e.isIntersecting && e.intersectionRatio >= .55) { if (!visibleAt) visibleAt = performance.now(); clearTimeout(t); t = setTimeout(open, 300); } else { visibleAt = 0; clearTimeout(t); } } }, { threshold: [0, .55, 1] }).observe(document.documentElement);
else { visibleAt = performance.now(); setTimeout(open, 400); }
if (/[?&]at=\d+/.test(location.search)) { opened = true; go(+location.search.match(/[?&]at=(\d+)/)[1], 1); }
</script>
</body>
</html>
